# SonarQube Cloud — project identity.
#
# Read these off the project itself (Administration -> Information, or the
# `?id=` in the project page's URL) rather than deriving them. The first CI run
# failed because the organisation had been guessed from the GitHub owner, and
# the project then lived in an unrelated organisation; it has since been
# recreated under `rab97` as a private project.
#
# A wrong value here does not fail loudly in every case: it can upload to a
# project nobody is looking at.
sonar.projectKey=rab97_pitchside
sonar.organization=rab97

# What is product code and what is a test.
#
# Both point at `src` on purpose: this project keeps every test beside the file
# it proves (`Select.test.tsx` next to `Select.tsx`), so the two sets cannot be
# separated by directory. `sonar.test.inclusions` is what draws the line. Get
# this wrong and Sonar counts the tests as product code, which sinks coverage
# and inflates duplication — tests resemble each other by nature.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**

# Generated from the database schema by `npm run types`. Nothing here is
# written by hand, and its size would dominate every ratio on the project.
sonar.exclusions=src/shared/lib/database.types.ts

# The application bootstrap: no branches, nothing a test could assert.
sonar.coverage.exclusions=src/main.tsx

# The only format Sonar reads for JavaScript and TypeScript coverage. Produced
# by `npm run test:coverage` (Vitest, v8 provider).
#
# This number describes the TypeScript half of the product ONLY. A large part
# of this project's domain rules live in the database — row-level security, the
# exclusion constraints, the RPC functions — and are covered by the pgTAP suite
# under `supabase/tests/`, which Sonar cannot read. Read the percentage as
# "of `src/`", never as "of the product".
sonar.javascript.lcov.reportPaths=coverage/lcov.info
